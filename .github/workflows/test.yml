name: test
on:
  push:
    branches: [main, "arena/**", "research/**", "feature/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            warzone-offline/server/package.json
            warzone-offline/launcher/package.json
      - name: Install server
        working-directory: warzone-offline/server
        run: npm ci || npm install
      - name: Install launcher
        working-directory: warzone-offline/launcher
        run: npm ci || npm install
      - name: Run server tests (14)
        working-directory: warzone-offline/server
        run: npx vitest run --reporter=verbose
      - name: Run launcher tests (12)
        working-directory: warzone-offline/launcher
        run: npx vitest run --reporter=verbose
      - name: Docs check
        run: bash scripts/check-docs.sh
