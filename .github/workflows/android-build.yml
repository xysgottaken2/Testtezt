name: android-build

on:
  push:
    branches: [main, "arena/**", "research/**", "feature/**"]
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Generate Gradle Wrapper (if missing jar)
        working-directory: android
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ] || [ ! -s gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Wrapper jar missing or placeholder — regenerating via gradle wrapper"
            gradle wrapper --gradle-version 8.7 || echo "gradle wrapper failed, trying to continue"
          fi
          ls -lh gradle/wrapper/ || true

      - name: Run unit tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --stacktrace --info

      - name: Build debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Generate SHA256
        working-directory: android
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK" ]; then
            sha256sum "$APK" | tee "$APK.sha256"
            cat "$APK.sha256"
            ls -lh "$APK"
          else
            echo "APK not found at $APK" && exit 1
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: wzm-offline-launcher-debug
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Check no proprietary assets in repo
        run: |
          echo "Checking for forbidden proprietary files..."
          if find . -type f \( -name "*.apk" -o -name "*.xapk" -o -name "*.shard" \) -not -path "./android/app/build/*" -not -path "./.git/*" | grep -q .; then
            echo "Found proprietary files outside build dir!"
            find . -type f \( -name "*.apk" -o -name "*.xapk" -o -name "*.shard" \) -not -path "./android/app/build/*" -not -path "./.git/*"
            exit 1
          else
            echo "No proprietary files found outside build — OK"
          fi
