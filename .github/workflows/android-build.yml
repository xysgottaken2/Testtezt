name: android-build

on:
  push:
    branches: [main, "arena/**", "research/**", "feature/**"]
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK (preinstalled ubuntu-latest)
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "SDK=$SDK"
          SDKMANAGER=""
          if command -v sdkmanager >/dev/null 2>&1; then SDKMANAGER="sdkmanager"; fi
          if [ -z "$SDKMANAGER" ] && [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"; fi
          if [ -z "$SDKMANAGER" ]; then SDKMANAGER="$(find "$SDK" -name sdkmanager -type f 2>/dev/null | head -n 1)"; fi
          echo "SDKMANAGER=$SDKMANAGER"
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "platform-tools" 2>&1 | tail -n 10 || true
          fi
          echo "sdk.dir=$SDK" > android/local.properties
          cat android/local.properties
          ls -la "$SDK/platforms/" || true
          ls -la "$SDK/build-tools/" || true

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Generate Gradle Wrapper (strict, falha se não gerar)
        working-directory: android
        run: |
          chmod +x gradlew
          if [ ! -s gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Wrapper jar missing/empty — regenerating"
            gradle wrapper --gradle-version 8.7 --no-daemon
          fi
          ls -lh gradle/wrapper/
          test -s gradle/wrapper/gradle-wrapper.jar
          echo "wrapper jar OK"

      - name: Preflight — sintaxe Kotlin (aspas raw + comentário aninhado)
        run: python3 scripts/check-kotlin-preflight.py --dir android

      - name: Generate local CDNI certificate (throwaway, not versioned)
        run: |
          bash scripts/generate-local-cdni-cert.sh
          ls -l android/app/src/main/assets/
          test -s android/app/src/main/assets/cdn_local.p12
          test -s android/app/src/main/assets/cdn_local_ca.pem
          echo "certificado local OK"

      - name: Run unit tests
        id: unit_tests
        working-directory: android
        run: |
          set +e
          ./gradlew :app:testDebugUnitTest --stacktrace 2>&1 | tee ../gradle-test.log
          TEST_EXIT=${PIPESTATUS[0]}
          set -e
          echo "TEST_EXIT=$TEST_EXIT" >> "$GITHUB_ENV"
          echo "--- last 120 lines of gradle-test.log ---"
          tail -n 120 ../gradle-test.log || true
          exit 0

      - name: Report Gradle failure as annotations (legível via API)
        if: env.TEST_EXIT != '0'
        run: |
          LOG=gradle-test.log
          echo "== gradle-test.log (tail 80) =="
          tail -n 80 "$LOG" 2>/dev/null || echo "(no log)"
          if [ -f "$LOG" ]; then
            grep -n -E "FAILURE:|What went wrong|Caused by|error:|e: |Could not|not found|Execution failed|Unsupported|FAILED|BUILD FAILED|Plugin \[id" "$LOG" \
              | head -n 30 > /tmp/errlines.txt || true
            n=0
            while IFS= read -r line; do
              n=$((n+1))
              esc=$(printf '%s' "$line" | tr -d '\r' | cut -c1-900 | sed 's/%/%25/g')
              echo "::error title=gradle-error-$n::$esc"
            done < /tmp/errlines.txt
            echo "annotations emitted: $n"
          else
            echo "::error title=gradle-log-missing::gradle-test.log not found"
          fi

      - name: Upload test logs and reports on failure
        if: env.TEST_EXIT != '0'
        uses: actions/upload-artifact@v4
        with:
          name: android-test-logs
          path: |
            gradle-test.log
            android/app/build/reports/
            android/app/build/test-results/
          if-no-files-found: warn
          retention-days: 7

      - name: Report unit test failures as annotations (XML -> check-run, legível via API)
        if: always()
        run: |
          python3 scripts/ci-report-test-failures.py \
            --dir android/app/build/test-results/testDebugUnitTest || true

      - name: Fail if unit tests failed
        if: env.TEST_EXIT != '0'
        run: |
          echo "Unit tests failed with exit code $TEST_EXIT"
          exit 1

      - name: Build debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Generate SHA256
        working-directory: android
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK" ]; then
            sha256sum "$APK" | tee "$APK.sha256"
            cat "$APK.sha256"
            ls -lh "$APK"
          else
            echo "APK not found at $APK" && exit 1
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: wzm-offline-launcher-debug
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Announce APK SHA256 (annotation legível via API)
        if: success()
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          SHA=$(cut -d' ' -f1 "$APK.sha256")
          SIZE=$(stat -c%s "$APK")
          echo "APK sha256=$SHA size=$SIZE"
          echo "::notice title=wzm-offline-launcher-debug::sha256=$SHA size=$SIZE bytes"

      - name: Check no proprietary assets in repo
        run: |
          echo "Checking for forbidden proprietary files..."
          if find . -type f \( -name "*.apk" -o -name "*.xapk" -o -name "*.shard" \) -not -path "./android/app/build/*" -not -path "./.git/*" | grep -q .; then
            echo "Found proprietary files outside build dir!"
            find . -type f \( -name "*.apk" -o -name "*.xapk" -o -name "*.shard" \) -not -path "./android/app/build/*" -not -path "./.git/*"
            exit 1
          else
            echo "No proprietary files found outside build — OK"
          fi
