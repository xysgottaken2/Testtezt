name: build
on:
  push:
    branches: [main, "arena/**", "research/**", "feature/**"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: warzone-offline/server/package.json
      - name: Install
        working-directory: warzone-offline/server
        run: npm ci || npm install
      - name: Typecheck
        working-directory: warzone-offline/server
        run: npx tsc --noEmit
      - name: Check docs
        run: bash scripts/check-docs.sh
      - name: Upload artifact (server skeleton)
        uses: actions/upload-artifact@v4
        with:
          name: warzone-offline-server-skeleton
          path: |
            warzone-offline/server/src
            warzone-offline/server/package.json
            warzone-offline/server/tsconfig.json
            docs/
